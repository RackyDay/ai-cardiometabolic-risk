name: CI Pipeline

on:
  push:
    branches:
    - develop
    - feature/**
  pull_request:
    branches:
    - develop

jobs:
  backend:
    name: Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Check backend starts correctly
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/docs || exit 1
        working-directory: backend

      - name: Run backend tests
        run: pytest test_main.py -v
        working-directory: backend

  frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend