name: CI Pipeline

on:
  push:
    branches: [develop, 'feature/**', 'testing_final*']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Check Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints-test.txt

      - name: Run all backend tests offline
        run: python -m pytest -q --junitxml=test-results/pytest.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run all frontend tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Build
        run: npm run build

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 14